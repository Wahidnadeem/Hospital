<title>صحت هرات</title>
<meta name="description" content="سیستم دیجیتال صحی هرات (HDHS)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&family=Noto+Nastaliq+Urdu:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EEF2F4; --surface-3:#E4EAEE;
  --ink:#0F1E2E; --ink-2:#4A5B6C; --ink-3:#7C8B99; --line:#DCE3E8; --line-2:#C9D3DA;
  --accent:#0C7C7A; --accent-2:#0A6563; --accent-soft:#DCEFEE; --accent-ink:#FFFFFF;
  --brass:#A8823F; --brass-soft:#F3EBDC;
  --side:#10233F; --side-2:#0B1A31; --side-ink:#E9EEF5; --side-ink-2:#9FB0C6; --side-line:rgba(201,165,90,.22);
  --ok:#1C7F52; --ok-soft:#DFF1E7; --warn:#A86A00; --warn-soft:#FBEFD6; --crit:#B83232; --crit-soft:#F9E1E0; --info:#2A5FA8; --info-soft:#E1EAF7;
  --tri-red:#C8352F; --tri-yellow:#D39B0B; --tri-green:#23915C;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --seq-0:#E6F1F1; --seq-1:#B9DCDB; --seq-2:#7FBFBD; --seq-3:#2E8C89; --seq-4:#0C7C7A; --seq-5:#075250;
  --seq-ink-0:#0F1E2E; --seq-ink-1:#0F1E2E; --seq-ink-2:#0F1E2E; --seq-ink-3:#FFFFFF; --seq-ink-4:#FFFFFF; --seq-ink-5:#FFFFFF;
  --shadow:0 1px 2px rgba(15,30,46,.05), 0 8px 24px -12px rgba(15,30,46,.12);
  --shadow-lg:0 24px 64px -16px rgba(10,20,40,.35);
  --r:14px; --r-sm:10px;
  --ff:'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --ff-nast:'Noto Nastaliq Urdu', 'Vazirmatn', serif;
  --ff-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A111C; --surface:#101A28; --surface-2:#152234; --surface-3:#1B2B40;
    --ink:#E7EDF4; --ink-2:#A6B4C4; --ink-3:#74849A; --line:#223248; --line-2:#2D405A;
    --accent:#2DB3AC; --accent-2:#4CC7C0; --accent-soft:#12302F; --accent-ink:#04201F;
    --brass:#D2AE6B; --brass-soft:#2C2517;
    --side:#081222; --side-2:#050C18; --side-ink:#E7EDF4; --side-ink-2:#8FA2BA;
    --ok:#4CC08A; --ok-soft:#10301F; --warn:#E3AD45; --warn-soft:#33260C; --crit:#F07A74; --crit-soft:#3A1717; --info:#79A6EA; --info-soft:#14243D;
    --tri-red:#EE6A62; --tri-yellow:#E5B236; --tri-green:#4CC08A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --seq-0:#12252A; --seq-1:#15403F; --seq-2:#1B5E5B; --seq-3:#23807B; --seq-4:#2DB3AC; --seq-5:#7FE0D9;
    --seq-ink-0:#E7EDF4; --seq-ink-1:#E7EDF4; --seq-ink-2:#E7EDF4; --seq-ink-3:#F4F8FB; --seq-ink-4:#04201F; --seq-ink-5:#04201F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A111C; --surface:#101A28; --surface-2:#152234; --surface-3:#1B2B40;
  --ink:#E7EDF4; --ink-2:#A6B4C4; --ink-3:#74849A; --line:#223248; --line-2:#2D405A;
  --accent:#2DB3AC; --accent-2:#4CC7C0; --accent-soft:#12302F; --accent-ink:#04201F;
  --brass:#D2AE6B; --brass-soft:#2C2517;
  --side:#081222; --side-2:#050C18; --side-ink:#E7EDF4; --side-ink-2:#8FA2BA;
  --ok:#4CC08A; --ok-soft:#10301F; --warn:#E3AD45; --warn-soft:#33260C; --crit:#F07A74; --crit-soft:#3A1717; --info:#79A6EA; --info-soft:#14243D;
  --tri-red:#EE6A62; --tri-yellow:#E5B236; --tri-green:#4CC08A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --seq-0:#12252A; --seq-1:#15403F; --seq-2:#1B5E5B; --seq-3:#23807B; --seq-4:#2DB3AC; --seq-5:#7FE0D9;
    --seq-ink-0:#E7EDF4; --seq-ink-1:#E7EDF4; --seq-ink-2:#E7EDF4; --seq-ink-3:#F4F8FB; --seq-ink-4:#04201F; --seq-ink-5:#04201F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{direction:rtl;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--ff-mono);font-size:.86em;letter-spacing:.01em;unicode-bidi:isolate;direction:ltr;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:
  radial-gradient(120% 60% at 100% 0%, rgba(201,165,90,.14), transparent 60%),
  linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-ink);overflow:hidden;z-index:40}
.side::before{content:"";position:absolute;inset:0;background-image:var(--girih);background-size:64px 64px;opacity:.10;pointer-events:none;mask-image:linear-gradient(180deg,#000 0%,transparent 55%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 55%)}
.brand{position:relative;padding:22px 22px 18px;border-bottom:1px solid var(--side-line)}
.brand .word{font-family:var(--ff-nast);font-size:30px;line-height:1.9;color:#D8B876;display:block;margin-top:-6px}
.brand .sub{font-size:11.5px;color:var(--side-ink-2);letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.brand .sub b{font-family:var(--ff-mono);font-weight:500;color:var(--side-ink);letter-spacing:.14em;font-size:10.5px}
.nav{position:relative;flex:1;overflow-y:auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.nav .grp{font-size:11px;color:var(--side-ink-2);padding:14px 12px 4px;letter-spacing:.04em}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--side-ink-2);font-size:14px;position:relative;transition:background .15s,color .15s}
.nav button svg{width:19px;height:19px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--side-ink)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(201,165,90,.04),rgba(201,165,90,.16));color:#fff}
.nav button[aria-current="page"]::after{content:"";position:absolute;inset-inline-start:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#D2AE6B}
.nav button:focus-visible{outline:2px solid #D2AE6B}
.nav .cnt{margin-inline-start:auto;font-size:11px;background:rgba(255,255,255,.08);color:var(--side-ink);padding:0 7px;border-radius:20px;line-height:20px}
.nav .cnt.hot{background:#B83232;color:#fff}
.side-foot{position:relative;padding:14px 20px;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-ink-2);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--side-ink-2);flex:none}
.sync[data-s="ok"] i{background:#4CC08A;box-shadow:0 0 0 3px rgba(76,192,138,.18)}
.sync[data-s="busy"] i{background:#E3AD45;animation:pulse 1s infinite}
.sync[data-s="err"] i{background:#F07A74}
@keyframes pulse{50%{opacity:.35}}

.main-wrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding-block:12px;padding-inline:clamp(16px,3vw,34px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .menu{display:none}
.top .date{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.top .date b{font-weight:600;font-size:14px;white-space:nowrap}
.top .date span{font-size:11.5px;color:var(--ink-3)}
.gsearch{position:relative;flex:1;max-width:460px;margin-inline-start:auto}
.gsearch input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding-inline:40px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
.gsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gsearch svg{position:absolute;inset-inline-start:13px;top:11px;width:18px;height:18px;color:var(--ink-3)}
.gsearch .res{position:absolute;inset-inline:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:360px;overflow:auto;padding:6px;z-index:50}
.gsearch .res button{all:unset;display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:9px;cursor:pointer}
.gsearch .res button:hover,.gsearch .res button:focus-visible{background:var(--surface-2)}
.role{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding-inline:12px 30px;max-width:170px}
main{padding-block:26px 110px;padding-inline:clamp(16px,3vw,34px);max-width:1480px;width:100%}

.bottom{display:none}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph .eyebrow{font-size:12px;color:var(--brass);letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ph .eyebrow::before{content:"";width:18px;height:1px;background:var(--brass)}
.ph h1{font-size:clamp(22px,2.4vw,28px);font-weight:800;letter-spacing:-.01em}
.ph p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding-inline:16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dan{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.dan:hover{background:var(--crit-soft)}
.btn.sm{height:32px;padding-inline:11px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--ink-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:18px;height:18px}

.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lb{font-size:12.5px;color:var(--ink-2);font-weight:500}
.f .req::after{content:" *";color:var(--crit)}
.in,select.in,textarea.in{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:8px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
textarea.in{min-height:78px;resize:vertical;line-height:1.7}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in[aria-invalid="true"]{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.f .err{font-size:12px;color:var(--crit)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 16px}
.grid-f .span2{grid-column:span 2}
.grid-f .full{grid-column:1/-1}
.fs{border:0;padding:0;margin:0 0 20px}
.fs>legend,.fs-h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:10px;width:100%;padding:0}
.fs>legend::after,.fs-h::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.chk input{width:17px;height:17px;accent-color:var(--accent)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card.pad{padding:18px 20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:18px;height:18px;flex:none;color:var(--brass)}
.card-h h3 small{font-weight:400;color:var(--ink-3);font-size:12px}
.card-b{padding:16px 20px}
.g{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{position:relative;padding:18px 20px 16px;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .l svg{width:16px;height:16px;color:var(--brass)}
.kpi .v{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.2}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink-3);margin-inline-start:4px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .bar{height:5px;border-radius:5px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.kpi.alert .v{color:var(--crit)}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding-inline:9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill.line{background:transparent;border-color:var(--line-2)}
.bt{display:inline-grid;place-items:center;min-width:38px;height:24px;padding-inline:6px;border-radius:7px;font-family:var(--ff-mono);font-size:12px;font-weight:600;background:var(--crit-soft);color:var(--crit);direction:ltr}
.bt.u{background:var(--surface-2);color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;height:24px;padding-inline:9px;border-radius:7px;font-size:12px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tri{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tri.red{background:var(--tri-red)} .tri.yellow{background:var(--tri-yellow)} .tri.green{background:var(--tri-green)}

/* avatar */
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.av.b{background:var(--brass-soft);color:var(--brass);border-color:color-mix(in srgb,var(--brass) 25%,transparent)}
.av.lg{width:64px;height:64px;border-radius:18px;font-size:24px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who .t{min-width:0;line-height:1.45}
.who .t b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .t span{font-size:12px;color:var(--ink-3)}

/* table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.t td.n,.t th.n{text-align:end;font-variant-numeric:tabular-nums}

/* list rows */
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .time{font-family:var(--ff-mono);font-size:13px;color:var(--ink-2);width:48px;flex:none;direction:ltr;text-align:center}

.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty svg{width:34px;height:34px;display:block;margin:0 auto 8px;opacity:.5}

/* filters bar */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fbar .in{width:auto;min-width:150px;min-height:38px}
.fbar .search{flex:1;min-width:220px;position:relative}
.fbar .search .in{width:100%;padding-inline-start:38px}
.fbar .search svg{position:absolute;inset-inline-start:12px;top:10px;width:18px;height:18px;color:var(--ink-3)}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.day{all:unset;cursor:pointer;flex:none;min-width:66px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;line-height:1.35}
.day .w{font-size:11.5px;color:var(--ink-3)} .day .d{font-size:18px;font-weight:700} .day .m{font-size:11px;color:var(--ink-2)}
.day .c{font-size:10.5px;margin-top:2px;color:var(--accent)}
.day[aria-pressed="true"]{background:var(--side);border-color:var(--side);color:#fff}
.day[aria-pressed="true"] .w,.day[aria-pressed="true"] .m{color:#C9D5E6} .day[aria-pressed="true"] .c{color:#D8B876}
.day.today:not([aria-pressed="true"]){border-color:var(--brass)}
.day[disabled]{opacity:.45;cursor:not-allowed}

/* slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.slot{all:unset;cursor:pointer;text-align:center;padding:7px 0;border-radius:9px;border:1px solid var(--line-2);font-family:var(--ff-mono);font-size:13px;direction:ltr;background:var(--surface)}
.slot:hover{border-color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot[disabled]{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through;cursor:not-allowed;border-color:var(--line)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brass);font-weight:600}
.tabs .c{font-size:11px;background:var(--surface-2);border-radius:20px;padding:0 7px;line-height:19px;color:var(--ink-2)}

/* patient storyboard */
.story{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px 22px;align-items:start;padding:22px}
.story h2{font-size:22px;font-weight:800}
.story .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2);font-size:13px;margin-top:6px}
.story .meta span{display:inline-flex;align-items:center;gap:6px}
.allergy{display:flex;gap:10px;align-items:flex-start;background:var(--crit-soft);color:var(--crit);border-radius:12px;padding:10px 14px;font-size:13.5px;border:1px solid color-mix(in srgb,var(--crit) 25%,transparent)}
.allergy svg{width:18px;height:18px;flex:none;margin-top:3px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;font-size:13px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.note svg{width:17px;height:17px;flex:none;margin-top:3px}
.note.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.note.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.note.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.note.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 25%,transparent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stat-row{display:flex;gap:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.4}
.stat .v{font-size:19px;font-weight:700} .stat .l{font-size:11.5px;color:var(--ink-3)}
.news{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;font-weight:600;font-size:13px}

/* timeline */
.tl{position:relative;padding-inline-start:22px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl .it{position:relative;padding-bottom:18px}
.tl .it::before{content:"";position:absolute;inset-inline-start:-21px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--brass)}
.tl .it h4{font-size:14px}
.tl .it .d{font-size:12px;color:var(--ink-3)}

/* hospital cards */
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.hcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.hcard .top-b{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--surface-2))}
.hcard h3{font-size:16.5px}
.hcard .en{font-family:var(--ff-mono);font-size:11.5px;color:var(--ink-3);direction:ltr;text-align:end;display:block}
.hcard .body{padding:14px 20px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.occ{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden;display:flex}
.occ i{display:block;height:100%}
.copy{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-mono);font-size:12.5px;direction:ltr;user-select:all}

/* doctor cards */
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dcard{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.dcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.dcard .en{font-size:11.5px;color:var(--ink-3);direction:ltr;text-align:end;font-family:var(--ff-mono)}

/* beds */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bed{all:unset;cursor:pointer;border-radius:10px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1.5;display:flex;flex-direction:column;min-height:52px}
.bed b{font-family:var(--ff-mono);font-size:12.5px;direction:ltr;text-align:end}
.bed.occupied{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.bed.reserved{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.bed.maintenance{background:var(--surface-2);color:var(--ink-3)}
.bed.available{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}

/* blood grid */
.bgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bcell{border-radius:10px;padding:8px 4px;text-align:center;background:var(--surface-2);border:1px solid var(--line);line-height:1.3}
.bcell .ty{font-family:var(--ff-mono);font-size:12px;font-weight:600;direction:ltr}
.bcell .u{font-size:18px;font-weight:800}
.bcell.low{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .bcell.low .u{color:var(--warn)}
.bcell.out{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 30%,transparent)} .bcell.out .u{color:var(--crit)}
.bcell .adj{display:flex;justify-content:center;gap:2px;margin-top:4px}
.bcell .adj button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);font-weight:700}
.bcell .adj button:hover{background:var(--surface)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.kcol h4{font-size:13px;display:flex;justify-content:space-between;color:var(--ink-2)}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--line-2)}
.kc.red{border-inline-start-color:var(--tri-red)} .kc.yellow{border-inline-start-color:var(--tri-yellow)} .kc.green{border-inline-start-color:var(--tri-green)}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--ff);font-size:11px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--surface-3);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12px;line-height:1.6;box-shadow:var(--shadow-lg);max-width:240px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%}
.heat td,.heat th{text-align:center;padding:6px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.heat th{font-weight:500;color:var(--ink-3);font-size:11.5px}
.heat th.dn{text-align:start;color:var(--ink);font-size:12.5px;white-space:nowrap;padding-inline-end:10px}

/* modal */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(6,12,24,.52);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;border:1px solid var(--line);animation:rise .18s ease-out}
.modal.wide{width:min(980px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:17px}
.modal .mh .sub{font-size:12px;color:var(--ink-3);font-weight:400}
.modal .mb{padding:20px 22px;overflow-y:auto;flex:1}
.modal .mf{display:flex;gap:8px;justify-content:flex-start;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.modal .mf .sp{flex:1}
.form-err{margin-bottom:14px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}}

/* chips input */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px 6px 3px 10px;font-size:12.5px}
.chip button{all:unset;cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.chip button:hover{background:var(--surface-3);color:var(--crit)}
.ac{position:relative}
.ac .res{position:absolute;inset-inline:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);max-height:240px;overflow:auto;z-index:20;padding:4px}
.ac .res button{all:unset;display:flex;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.ac .res button:hover,.ac .res button.on{background:var(--surface-2)}
.rxrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rxrow .in{min-height:38px;background:var(--surface)}
.testgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}

/* toast */
.toasts{position:fixed;z-index:300;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;animation:rise .2s}
.toast.err{background:var(--crit);color:#fff}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}

.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
.loading{display:grid;place-items:center;min-height:60vh;text-align:center;gap:10px;color:var(--ink-3)}
.loading .word{font-family:var(--ff-nast);font-size:34px;color:var(--brass);line-height:2}

.banner{display:flex;gap:10px;align-items:center;background:var(--brass-soft);color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 25%,transparent);border-radius:12px;padding:8px 14px;font-size:12.5px;margin-bottom:18px}
.banner svg{width:16px;height:16px;flex:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-21,.g-12{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(290px,86vw);height:100%;transform:translateX(105%);transition:transform .25s ease;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .side-scrim{position:fixed;inset:0;background:rgba(6,12,24,.45);z-index:39}
  .top .menu{display:inline-grid}
  .top .date span{display:none}
  .role{max-width:120px}
  .bottom{display:flex;position:fixed;z-index:35;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);padding:4px 0;border-radius:10px}
  .bottom button svg{width:21px;height:21px}
  .bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
  .g2{grid-template-columns:minmax(0,1fr)}
  .story{grid-template-columns:auto minmax(0,1fr);padding:18px}
  .story .acts{grid-column:1/-1}
}
@media (max-width:640px){
  body{font-size:14px}
  .gsearch{display:none}
  .gsearch.open{display:block;position:fixed;inset-inline:12px;top:calc(8px + env(safe-area-inset-top,0px));max-width:none;z-index:60}
  .top .srch-btn{display:inline-grid !important}
  .kpis{gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:25px}
  .g3{grid-template-columns:minmax(0,1fr)}
  .card-h,.card-b{padding-inline:16px}
  .li{padding-inline:16px}
  .grid-f .span2{grid-column:auto}
  .scrim{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;border-radius:18px 18px 0 0;max-height:94%}
  .rxrow{grid-template-columns:1fr 1fr}
  .rxrow>:first-child{grid-column:1/-1}
  .bgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hcards{grid-template-columns:minmax(0,1fr)}
  .story .av.lg{width:52px;height:52px;font-size:20px}
  .t.cards thead{display:none}
  .t.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .t.cards td{border:0;padding:0}
  .t.cards td[data-h]::before{content:attr(data-h) ": ";color:var(--ink-3);font-size:11.5px}
  .t.cards td.hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="root" dir="rtl" lang="fa-AF"></div>
<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','fa-AF');
/* HDHS relational schema (client engine).
   fk: { column: [parentTable, mode] }  mode: 'r' = RESTRICT, 'c' = CASCADE, 'n' = SET NULL
   b: number of storage buckets (documents) the table is spread over */
const SCHEMA = {
  roles:            { b:1, label:'نقش‌ها', req:['name'], uniq:['name'] },
  users:            { b:4, label:'کاربران', req:['first_name','last_name','role_id'], uniq:['national_id','phone','email'],
                      fk:{ role_id:['roles','r'] },
                      enums:{ gender:['male','female','other'], blood_type:['A+','A-','B+','B-','AB+','AB-','O+','O-','Unknown'], status:['active','inactive','suspended'], language:['dari','pashto','english'] } },
  specializations:  { b:1, label:'تخصص‌ها', req:['name'] },
  hospitals:        { b:1, label:'شفاخانه‌ها', req:['name','type'],
                      enums:{ type:['public_hospital','private_hospital','clinic','health_center','subcenter','CHC'], status:['active','inactive','closed'] } },
  departments:      { b:1, label:'بخش‌ها', req:['hospital_id','name'], fk:{ hospital_id:['hospitals','c'], head_doctor_id:['doctors','n'] } },
  doctors:          { b:2, label:'داکتران', req:['user_id','specialization_id','hospital_id'], uniq:['user_id','license_number'],
                      fk:{ user_id:['users','r'], specialization_id:['specializations','r'], hospital_id:['hospitals','r'] },
                      enums:{ status:['active','inactive','on_leave'] } },
  doctor_availability:{ b:1, label:'زمان‌بندی داکتران', req:['doctor_id','day_of_week','start_time','end_time'],
                      fk:{ doctor_id:['doctors','c'], hospital_id:['hospitals','r'] } },
  patients:         { b:4, label:'بیماران', req:['user_id','mrn'], uniq:['user_id','mrn'], fk:{ user_id:['users','r'] }, idx:['district'],
                      enums:{ marital_status:['single','married','widowed','divorced'] } },
  appointments:     { b:4, label:'نوبت‌ها', req:['appointment_no','patient_id','doctor_id','hospital_id','appointment_date','appointment_time'], uniq:['appointment_no'],
                      fk:{ patient_id:['patients','r'], doctor_id:['doctors','r'], hospital_id:['hospitals','r'], department_id:['departments','n'] },
                      idx:['appointment_date','status'],
                      enums:{ type:['in_person','telemedicine_video','telemedicine_audio','home_visit'], status:['pending','confirmed','checked_in','in_progress','completed','cancelled','no_show'], priority:['normal','urgent','emergency'] },
                      check(row, S){
                        if (row.status === 'cancelled' || row.status === 'no_show') return;
                        const clash = S.by('appointments','doctor_id',row.doctor_id).find(a => a.id !== row.id && a.appointment_date === row.appointment_date && a.appointment_time === row.appointment_time && a.status !== 'cancelled' && a.status !== 'no_show');
                        if (clash) return 'این داکتر در همین تاریخ و ساعت نوبت دیگری دارد.';
                      } },
  payments:         { b:2, label:'پرداخت‌ها', req:['payment_no','patient_id','amount'], uniq:['payment_no','appointment_id'],
                      fk:{ patient_id:['patients','r'], appointment_id:['appointments','n'] },
                      enums:{ payment_method:['cash','mobile_money','card','insurance','free'], status:['pending','completed','refunded','failed'] },
                      check(row){ if (!(row.amount >= 0)) return 'مبلغ پرداخت نمی‌تواند منفی باشد.'; } },
  medical_records:  { b:4, label:'پرونده‌های طبی', req:['patient_id','doctor_id','hospital_id','visit_date'], uniq:['appointment_id'],
                      fk:{ patient_id:['patients','r'], doctor_id:['doctors','r'], appointment_id:['appointments','r'], hospital_id:['hospitals','r'] },
                      enums:{ visit_type:['outpatient','inpatient','emergency','telemedicine'] } },
  diagnoses:        { b:4, label:'تشخیص‌ها', req:['record_id','diagnosis_name'], fk:{ record_id:['medical_records','c'] },
                      enums:{ type:['primary','secondary','provisional','final'], severity:['mild','moderate','severe','critical'] } },
  vital_signs:      { b:4, label:'علائم حیاتی', req:['patient_id'], fk:{ patient_id:['patients','r'], record_id:['medical_records','c'], recorded_by:['users','n'] },
                      check(r){
                        if (r.pain_scale != null && (r.pain_scale < 0 || r.pain_scale > 10)) return 'مقیاس درد باید بین ۰ و ۱۰ باشد.';
                        if (r.oxygen_sat != null && (r.oxygen_sat < 50 || r.oxygen_sat > 100)) return 'اشباع اکسیجن باید بین ۵۰ و ۱۰۰ باشد.';
                        if (r.bp_systolic != null && r.bp_diastolic != null && r.bp_diastolic >= r.bp_systolic) return 'فشار دیاستولیک باید کمتر از سیستولیک باشد.';
                        if (r.temperature != null && (r.temperature < 30 || r.temperature > 45)) return 'درجه حرارت خارج از محدوده ممکن است.';
                      } },
  medicines:        { b:1, label:'دارونامه', req:['generic_name'] },
  drug_interactions:{ b:1, label:'تداخلات دارویی', req:['drug1_id','drug2_id','severity'], fk:{ drug1_id:['medicines','c'], drug2_id:['medicines','c'] },
                      enums:{ severity:['minor','moderate','major','contraindicated'] } },
  pharmacies:       { b:1, label:'دواخانه‌ها', req:['name'], uniq:['license_number'], fk:{ hospital_id:['hospitals','n'] } },
  pharmacy_inventory:{ b:2, label:'موجودی دواخانه', req:['pharmacy_id','medicine_id','quantity','expiry_date'],
                      fk:{ pharmacy_id:['pharmacies','c'], medicine_id:['medicines','r'] },
                      check(r){ if (!(r.quantity >= 0)) return 'تعداد موجودی نمی‌تواند منفی باشد.'; } },
  prescriptions:    { b:2, label:'نسخه‌ها', req:['prescription_no','doctor_id','patient_id','prescription_date'], uniq:['prescription_no'],
                      fk:{ record_id:['medical_records','c'], doctor_id:['doctors','r'], patient_id:['patients','r'], pharmacy_id:['pharmacies','n'], dispensed_by:['users','n'] },
                      idx:['status'],
                      enums:{ status:['pending','dispensed','partially_dispensed','cancelled'] } },
  prescription_items:{ b:2, label:'اقلام نسخه', req:['prescription_id','medicine_id','quantity'],
                      fk:{ prescription_id:['prescriptions','c'], medicine_id:['medicines','r'] },
                      enums:{ route:['oral','injection','topical','inhaler','drops','other'] },

  if (a.status === 'confirmed' && can('appt')) b.push(`<button class="btn sm pri" data-act="appt-set" data-id="${a.id}" data-s="checked_in">پذیرش</button>`, `<button class="btn sm ghost" data-act="appt-set" data-id="${a.id}" data-s="no_show">غیرحاضر</button>`);
  if (a.status === 'checked_in' && can('visit')) b.push(`<button class="btn sm pri" data-act="visit" data-id="${a.id}">${I.play}شروع ویزیت</button>`);
  if (a.status === 'in_progress' && can('visit')) b.push(`<button class="btn sm pri" data-act="visit" data-id="${a.id}">${I.steth}ادامه ویزیت</button>`);
  if (['pending', 'confirmed'].includes(a.status) && can('appt')) b.push(`<button class="btn sm dan" data-act="appt-cancel" data-id="${a.id}">لغو</button>`);
  return b.join('');

/* ---------- surveillance ---------- */
const epiWeek = (s) => { const d = parseISO(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
function survData() {
  const rows = Store.all('disease_surveillance');
  const year = rows.length ? Math.max(...rows.map(r => r.year)) : new Date().getFullYear();
  const yr = rows.filter(r => r.year === year);
  const weeksAll = [...new Set(yr.map(r => r.week_number))].sort((a, b) => a - b).slice(-8);
  const sum = {}, deaths = {}, byDist = {};
  for (const r of yr) { if (!weeksAll.includes(r.week_number)) continue; (sum[r.disease_name] = sum[r.disease_name] || {})[r.week_number] = (sum[r.disease_name][r.week_number] || 0) + (r.new_cases || 0); (deaths[r.disease_name] = deaths[r.disease_name] || {})[r.week_number] = (deaths[r.disease_name][r.week_number] || 0) + (r.deaths || 0); }
  const last = weeksAll[weeksAll.length - 1];
  for (const r of yr) if (r.week_number === last) ((byDist[r.disease_name] = byDist[r.disease_name] || {})[r.district] = (byDist[r.disease_name][r.district] || 0) + (r.new_cases || 0));

/* ---------- booking ---------- */
function slotsFor(docId, date) {
  const dow = parseISO(date).getDay();
  const av = Store.by('doctor_availability', 'doctor_id', docId).filter(a => a.is_active !== false && Number(a.day_of_week) === dow);
  const taken = new Set(Store.by('appointments', 'doctor_id', docId).filter(a => a.appointment_date === date && !['cancelled', 'no_show'].includes(a.status)).map(a => a.appointment_time));
  const out = []; const now = new Date(); const isToday = date === TODAY();
  for (const a of av) { let [h, m] = a.start_time.split(':').map(Number); const [eh, em] = a.end_time.split(':').map(Number); const step = a.slot_duration || 15;
    while (h * 60 + m + step <= eh * 60 + em) { const t = pad2(h) + ':' + pad2(m); const past = isToday && (h * 60 + m) <= now.getHours() * 60 + now.getMinutes(); out.push({ t, taken: taken.has(t), past }); m += step; h += Math.floor(m / 60); m %= 60; } }
  return out;
}

function dispensePlan(rx, phId) {
  const t = TODAY(); const items = Store.by('prescription_items', 'prescription_id', rx.id).filter(i => !i.is_dispensed);
  return items.map(it => {
    const batches = Store.by('pharmacy_inventory', 'pharmacy_id', phId).filter(b => b.medicine_id === it.medicine_id && b.expiry_date >= t && b.quantity > 0).sort((a, b) => a.expiry_date.localeCompare(b.expiry_date));
    let left = it.quantity; const take = [];
    for (const b of batches) { if (!left) break; const n = Math.min(left, b.quantity); take.push({ b, n }); left -= n; }
    return { it, take, short: left };
  });
}

    view: s => `${ambs.length ? '' : note('امبولانس آماده‌ای وجود ندارد.', 'crit')}<div class="fs-h">امبولانس‌های آماده (نزدیک‌ترین اول)</div><div class="stack" style="gap:6px;margin-bottom:16px">${ambs.map(({ a, km }) => `<label class="chk" style="border:1px solid var(--line);border-radius:10px;padding:8px 12px"><input type="radio" name="amb" data-bind="ambulance_id" value="${a.id}" ${s.ambulance_id === a.id ? 'checked' : ''}><b class="mono">${esc(a.vehicle_number)}</b> · ${L.ambType[a.type]} · ${esc(hospName(a.hospital_id))}<span style="margin-inline-start:auto" class="faint">~${nf(km, 1)} کیلومتر · ~${fa(Math.max(3, Math.round(km / 40 * 60)))} دقیقه</span></label>`).join('')}</div>
      ${field('شفاخانه مقصد (پیش‌آگاهی ورود بیمار)', sel('hospital_id', s.hospital_id, hs.map(({ h, km }) => [h.id, `${h.name} · ~${nf(km, 1)} کیلومتر`]), { blank: false }), { for: 'f-hospital_id' })}`,
    save: s => { need(s.ambulance_id, 'امبولانس'); const a = Store.get('ambulances', s.ambulance_id); if (a.status !== 'available') throw new DbErr('این امبولانس دیگر آماده نیست.');
      Store.tx(() => { Store.update('ambulances', a.id, { status: 'on_call' }); Store.update('emergency_calls', id, { status: 'dispatched', ambulance_id: a.id, hospital_id: s.hospital_id || null, dispatched_at: nowISO() }); });
      return `امبولانس ${a.vehicle_number} اعزام شد.`; } });
}
function bedForm(bid) {
  const b = Store.get('bed_management', bid); const p = Store.get('patients', b.patient_id);
  openModal({ title: `تخت ${esc(b.bed_number)}`, sub: esc(hospName(b.hospital_id)) + ' · ' + (L.bedType[b.bed_type] || ''), state: { pq: '', status: b.status }, saveLabel: b.status === 'occupied' ? 'ترخیص بیمار' : 'بستری کردن',
    parts: { ppres: s => ppres(s), pres: s => patientPicker(s) },
    view: s => b.status === 'occupied' ? `${who(patName(p), mono(p.mrn) + ' · بستری از ' + fmtDate(b.admitted_at))}<p class="faint" style="margin-top:12px">با ترخیص، تخت آزاد و برای بیمار بعدی آماده می‌شود.</p>`
      : `<div class="stack"><div class="seg">${['available', 'reserved', 'maintenance'].map(k => `<button type="button" data-act="seg" data-k="status" data-v="${k}" aria-pressed="${s.status === k}">${L.bed[k][0]}</button>`).join('')}</div><div data-part="pres">${patientPicker(s)}</div><p class="faint" style="font-size:12px">برای بستری کردن بیمار را انتخاب کنید؛ یا فقط وضعیت تخت را تغییر دهید.</p></div>`,
    save: s => { if (b.status === 'occupied') { Store.update('bed_management', bid, { status: 'available', patient_id: null, admitted_at: null }); return 'بیمار ترخیص شد.'; }
      if (s.patient_id) { Store.update('bed_management', bid, { status: 'occupied', patient_id: s.patient_id, admitted_at: nowISO() }); return 'بیمار بستری شد.'; }
      Store.update('bed_management', bid, { status: s.status }); return 'وضعیت تخت به‌روز شد.'; } });
}
function bedNewForm(hid) {
  openModal({ title: 'افزودن تخت', sub: esc(hospName(hid)), state: { bed_type: 'general' }, saveLabel: 'افزودن',
    view: s => `<div class="grid-f">${field('نمبر تخت', inp('bed_number', s.bed_number, { dir: 'ltr' }), { req: 1, for: 'f-bed_number' })}${field('بخش', sel('department_id', s.department_id, Store.by('departments', 'hospital_id', hid).map(d => [d.id, d.name])), { req: 1, for: 'f-department_id' })}${field('نوع', sel('bed_type', s.bed_type, Object.entries(L.bedType), { blank: false }), { for: 'f-bed_type' })}</div>`,
    save: s => { need(s.bed_number, 'نمبر تخت'); need(s.department_id, 'بخش'); if (Store.by('bed_management', 'hospital_id', hid).some(x => normKey(x.bed_number) === normKey(s.bed_number))) throw new DbErr('این نمبر تخت در همین شفاخانه وجود دارد.');
      Store.insert('bed_management', { hospital_id: hid, department_id: s.department_id, bed_number: s.bed_number.trim(), bed_type: s.bed_type, status: 'available', patient_id: null, admitted_at: null }); return 'تخت اضافه شد.'; } });
}
function confirmModal(title, msg, onOk, okLabel = 'تأیید', danger = true) {
  openModal({ title, state: {}, view: () => `<p>${msg}</p>`, footer: () => `<button class="btn ${danger ? 'dan' : 'pri'}" data-act="m-save">${okLabel}</button><button class="btn" data-act="m-close">انصراف</button>`, save: onOk });
}

/* ================= events ================= */
const run = fn => { try { const m = fn(); if (typeof m === 'string') toast(m); } catch (e) { if (!(e instanceof DbErr)) console.error(e); toast(e.message, 'err'); } };
const ACT = {
  go: el => go(el.dataset.v), menu: () => { const s = document.getElementById('side'); s.classList.toggle('open'); if (s.classList.contains('open')) { const sc = document.createElement('div'); sc.className = 'side-scrim'; sc.onclick = closeSide; document.body.appendChild(sc); } else closeSide(); },
  'open-patient': el => go('patient', el.dataset.id), 'open-hospital': el => go('hospital', el.dataset.id),
  tab: el => { S.tab[el.dataset.k] = el.dataset.v; renderMain(false); },
  day: el => { S.day = el.dataset.v; renderMain(false); },
  book: el => bookForm({ patient: el.dataset.patient, doctor: el.dataset.doctor }),
  'patient-new': () => patientForm(), 'patient-edit': el => patientForm(el.dataset.id),
  'patient-del': el => { const id = el.dataset.id; const deps = Store.dependents('patients', id); confirmModal('حذف پرونده بیمار', deps.length ? `این پرونده رکوردهای وابسته دارد (${deps.map(d => `${SCHEMA[d.table].label}: ${fa(d.n)}`).join('، ')}). پایگاه داده حذف پرونده‌ای را که سوابق طبی دارد، اجازه نمی‌دهد.` : 'این پرونده برای همیشه حذف می‌شود.', () => { Store.tx(() => { const p = Store.get('patients', id); Store.remove('patients', id); Store.remove('users', p.user_id); }); setTimeout(() => go('patients')); return 'پرونده حذف شد.'; }, 'حذف'); },
  'vitals-new': el => vitalsForm(el.dataset.id), 'doctor-open': el => doctorModal(el.dataset.id), 'doctor-new': () => doctorNewForm(),
  'appt-set': el => run(() => { Store.update('appointments', el.dataset.id, { status: el.dataset.s }); return 'وضعیت نوبت: ' + L.appt[el.dataset.s][0]; }),
  'appt-cancel': el => cancelForm(el.dataset.id), visit: el => visitForm(el.dataset.id),
  ack: el => run(() => { Store.update('clinical_alerts', el.dataset.id, { is_acknowledged: true, acknowledged_by: actorUser() }); return 'هشدار بررسی شد.'; }),
  dispense: el => dispenseForm(el.dataset.id), 'rx-cancel': el => confirmModal('لغو نسخه', 'نسخه لغو می‌شود و قابل تحویل نخواهد بود.', () => { Store.update('prescriptions', el.dataset.id, { status: 'cancelled' }); return 'نسخه لغو شد.'; }, 'لغو نسخه'),
  'stock-new': el => stockForm(el.dataset.id),
  'lab-collect': el => run(() => { Store.update('lab_orders', el.dataset.id, { status: 'sample_collected', sample_collected_at: nowISO() }); return 'نمونه ثبت شد.'; }),
  'lab-result': el => labResultForm(el.dataset.id),
  'lab-review': el => run(() => { const o = Store.get('lab_orders', el.dataset.id); Store.update('lab_orders', o.id, { status: 'reviewed', reviewed_by: o.doctor_id }); return 'نتیجه بررسی شد.'; }),
  'vacc-give': el => confirmModal('ثبت تطبیق واکسین', `${esc(el.dataset.name)} امروز (${fmtDate(TODAY())}) برای ${esc(patName(Store.get('patients', el.dataset.id)))} ثبت شود؟`, () => { Store.insert('vaccinations', { patient_id: el.dataset.id, vaccine_name: el.dataset.name, vaccine_code: el.dataset.code, dose_number: Number(el.dataset.dose), batch_number: null, date_given: TODAY(), next_dose_date: null, given_by: actorUser(), hospital_id: null, site: null, adverse_reaction: null, notes: null }); return 'واکسین ثبت شد.'; }, 'ثبت', false),
  'preg-new': () => pregForm(), 'anc-new': el => ancForm(el.dataset.id), 'preg-close': el => pregCloseForm(el.dataset.id), 'growth-new': el => growthForm(el.dataset.id),
  'surv-new': () => survForm(), 'alert-new': el => alertForm(el.dataset.d, Number(el.dataset.n)),
  'alert-resolve': el => run(() => { Store.update('epidemic_alerts', el.dataset.id, { is_resolved: true, resolved_at: nowISO() }); return 'هشدار بسته شد.'; }),
  'call-new': () => callForm(),
  'call-next': el => { const id = el.dataset.id, s = el.dataset.s; if (s === 'dispatch') return dispatchForm(id); run(() => { const c = Store.get('emergency_calls', id); Store.tx(() => { const patch = { status: s }; if (s === 'arrived') patch.arrived_at = nowISO(); if (s === 'resolved' || s === 'cancelled') { patch.resolved_at = nowISO(); if (c.ambulance_id) Store.update('ambulances', c.ambulance_id, { status: 'available' }); } Store.update('emergency_calls', id, patch); }); return 'وضعیت: ' + L.call[s][0]; }); },
  blood: el => run(() => { const b = Store.get('blood_bank', el.dataset.id); Store.update('blood_bank', b.id, { units_available: (b.units_available || 0) + Number(el.dataset.d), updated_at: nowISO() }); }),
  'bed-open': el => { if (can('bed') || S.role === 'admin') bedForm(el.dataset.id); }, 'bed-new': el => bedNewForm(el.dataset.id),
  copy: el => { const v = el.dataset.v; const ok = () => toast('کاپی شد: ' + v); try { navigator.clipboard.writeText(v).then(ok, () => toast(v)); } catch (_) { toast(v); } },
  gsearch: () => { const g = document.getElementById('gs'); g.classList.toggle('open'); if (g.classList.contains('open')) document.getElementById('gq').focus(); },
  'reset-data': () => confirmModal('بازگردانی داده نمونه', 'همه تغییرات ذخیره‌شده در این مرورگر پاک و داده نمونه دوباره بارگذاری می‌شود.', () => { Sync.resetDevice(); }, 'بازگردانی'),
  'm-close': () => closeModal(), 'm-save': () => modalSave(),
  seg: el => { M.state[el.dataset.k] = el.dataset.v; renderModal(); },
  'pp-pick': el => { M.state.patient_id = el.dataset.id; M.state.pq = ''; renderParts(['pres']); },
  'pp-clear': () => { M.state.patient_id = null; renderParts(['pres']); const i = document.getElementById('f-pq'); i && i.focus(); },
  'bk-day': el => { M.state.date = el.dataset.v; M.state.time = ''; renderParts(['days', 'slots']); },
  'bk-slot': el => { M.state.time = el.dataset.v; renderParts(['slots']); },
  'dx-add': el => { if (M.state.dx.some(d => d.name === el.dataset.n)) return; M.state.dx.push({ code: el.dataset.c, name: el.dataset.n, type: M.state.dx.length ? 'secondary' : 'primary' }); M.state.dxq = ''; const i = document.getElementById('f-dxq'); i.value = ''; renderParts(['dxl', 'dxres']); i.focus(); },
  'dx-rm': el => { M.state.dx.splice(Number(el.dataset.i), 1); renderParts(['dxl']); },
  'rx-add': el => { const m = Store.get('medicines', el.dataset.id); const form = (m.dosage_forms || [])[0] || ''; M.state.rx.push({ medicine_id: m.id, dosage: (m.strengths || [])[0] || '', frequency: '', duration_days: '', quantity: '', route: form === 'injection' ? 'injection' : form === 'inhaler' ? 'inhaler' : 'oral' }); M.state.mq = ''; const i = document.getElementById('f-mq'); i.value = ''; renderParts(['rxl', 'rxw', 'mres']); },
  'rx-rm': el => { M.state.rx.splice(Number(el.dataset.i), 1); renderParts(['rxl', 'rxw']); },
};
function closeSide() { const s = document.getElementById('side'); s && s.classList.remove('open'); document.querySelectorAll('.side-scrim').forEach(x => x.remove()); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (!e.target.closest('#gs')) hideG(); return; }
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) { e.stopPropagation(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (M) closeModal(); else { closeSide(); hideG(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});
let fTimer;
function onInput(e) {
  const el = e.target;
  if (M && M.root.contains(el)) {
    if (el.dataset.vit) { M.state.v[el.dataset.vit] = el.value === '' ? null : Number(toLatin(el.value).replace('٫', '.')); renderParts(['vit']); return; }
    if (el.dataset.rx != null) { M.state.rx[Number(el.dataset.rx)][el.dataset.k] = el.value; return; }
    if (el.dataset.test) { M.state.tests[el.dataset.test] = el.checked; return; }
    if (el.dataset.dx != null) { M.state.dx[Number(el.dataset.dx)].type = el.value; return; }
    if (!el.dataset.bind) return;
    const k = el.dataset.bind; let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num != null) v = v === '' ? null : Number(toLatin(v).replace('٫', '.'));
    if (el.type === 'radio' && !el.checked) return;
    M.state[k] = v;
    if (e.type === 'change' && el.dataset.rerender != null) { renderModal(); const n = M.root.querySelector(`[data-bind="${k}"]`); n && n.focus(); return; }
    if (el.dataset.parts) renderParts(el.dataset.parts.split(','));
    return;
  }
  if (el.dataset.f) { S.f[el.dataset.f] = el.value; if (el.dataset.f === 'ah') S.f.ad = ''; clearTimeout(fTimer); fTimer = setTimeout(() => renderMain(false), el.tagName === 'INPUT' ? 90 : 0); return; }
  if (el.id === 'gq') { renderG(el.value); return; }
  if (el.id === 'role' && e.type === 'change') { S.role = el.value; Store.actor = { role: S.role, user_id: actorUser() }; saveUI(); go(canView(S.view) ? S.view : 'dashboard', S.param); toast('نقش فعال: ' + ROLE_UI[S.role].label); }
}
document.addEventListener('input', onInput); document.addEventListener('change', e => { const el = e.target; if (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT' || el.type === 'date' || el.type === 'time') onInput(e); });
function renderG(v) {
  const box = document.getElementById('gres'); const q = normKey(v); if (!q) { box.hidden = true; return; }
  const res = Store.all('patients').filter(p => patientMatches(p, q)).slice(0, 8);
  box.innerHTML = res.length ? res.map(p => `<button data-act="open-patient" data-id="${p.id}">${avatar(patName(p))}<span><b style="font-weight:600">${esc(patName(p))}</b><br><span class="mono faint">${esc(p.mrn)}</span></span></button>`).join('') : '<div class="faint" style="padding:10px">بیماری پیدا نشد.</div>';
  box.hidden = false;
}
function hideG() { const b = document.getElementById('gres'); if (b) b.hidden = true; const g = document.getElementById('gs'); if (g) g.classList.remove('open'); }
/* tooltips for charts / heat cells */
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); const tip = document.getElementById('tip'); if (!tip) return; if (!t) { tip.classList.remove('on'); return; } tip.textContent = t.dataset.tip; tip.style.whiteSpace = 'pre-line'; tip.classList.add('on'); });
document.addEventListener('mousemove', e => { const tip = document.getElementById('tip'); if (!tip || !tip.classList.contains('on')) return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 8) y = e.clientY + 16; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });

/* ================= boot ================= */
Store.init();
renderShell(); renderNav(); renderMain(true);
Store.on(scheduleRender);
Sync.listeners.add(() => { const el = document.getElementById('sync'); if (el) renderNav(); });
Sync.connect(mode => {
  S.mode = mode; Store.actor = { role: S.role, user_id: actorUser() };
  const init = (location.hash || '').replace('#', ''); if (init && NAV.some(n => n[0] === init)) S.view = init;
  if (!canView(S.view)) S.view = 'dashboard';
  renderMain(true); renderNav();
  if (mode === 'local') toast('پایگاه داده در دسترس نیست؛ صفحه در حالت محلی کار می‌کند و تغییرات ذخیره نمی‌شود.', 'err');
});

</script>
